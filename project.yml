name: Listen
options:
  bundleIdPrefix: com.divyam.listen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.1"
  ListenCore:
    path: Packages/ListenCore

targets:
  ListenMac:
    type: application
    platform: macOS
    sources:
      - ListenMac
    dependencies:
      - package: HotKey
      - package: ListenCore
        product: ListenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divyam.listen.mac
        PRODUCT_NAME: Listen
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ListenMac/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ListenMac/ListenMac.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: ListenMac/ListenMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.accessibility: true
